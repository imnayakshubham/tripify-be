[project]
name = "trip-planner"
version = "0.1.0"
description = "Multi-agent trip planner: destination, itinerary and budget agents over LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19",
    "apscheduler>=3.11",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]
